steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_IMAGE
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image
      - $_IMAGE
      - --region
      - $_REGION
      - --allow-unauthenticated
substitutions:
  _SERVICE_NAME: influencer-marketplace-demo
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/influencer-marketplace-demo:latest
images:
  - $_IMAGE
